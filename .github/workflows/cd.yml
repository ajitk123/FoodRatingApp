name: CD - Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.7.5"

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================================================
  # Determine Environment
  # ===========================================================================
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # Build Web Application
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build web application
        run: npm run build:web
        env:
          CI: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ needs.setup.outputs.environment }}
          path: web-build/
          retention-days: 3

  # ===========================================================================
  # Terraform Plan & Apply
  # ===========================================================================
  terraform:
    name: Terraform (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup]
    environment: ${{ needs.setup.outputs.environment }}
    timeout-minutes: 20

    outputs:
      s3_bucket: ${{ steps.outputs.outputs.s3_bucket }}
      cloudfront_id: ${{ steps.outputs.outputs.cloudfront_id }}
      website_url: ${{ steps.outputs.outputs.website_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file="environments/${{ needs.setup.outputs.environment }}/terraform.tfvars" \
            -out=tfplan \
            -input=false

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false tfplan

      - name: Get Terraform outputs
        id: outputs
        working-directory: terraform
        run: |
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "website_url=$(terraform output -raw website_url)" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Deploy to S3 + Invalidate CloudFront
  # ===========================================================================
  deploy:
    name: Deploy (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, build, terraform]
    environment:
      name: ${{ needs.setup.outputs.environment }}
      url: ${{ needs.terraform.outputs.website_url }}
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ needs.setup.outputs.environment }}
          path: web-build/

      - name: Deploy to S3
        run: |
          # Sync all files with appropriate cache headers
          aws s3 sync web-build/ s3://${{ needs.terraform.outputs.s3_bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "asset-manifest.json" \
            --exclude "service-worker.js"

          # HTML files should not be cached aggressively
          aws s3 sync web-build/ s3://${{ needs.terraform.outputs.s3_bucket }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "asset-manifest.json" \
            --include "service-worker.js" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ needs.terraform.outputs.website_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** ${{ needs.terraform.outputs.s3_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront ID:** ${{ needs.terraform.outputs.cloudfront_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Post-Deployment Verification
  # ===========================================================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [setup, deploy, terraform]
    timeout-minutes: 5

    steps:
      - name: Health check
        run: |
          SITE_URL="${{ needs.terraform.outputs.website_url }}"
          echo "Checking $SITE_URL ..."

          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

      - name: Verify critical assets
        run: |
          SITE_URL="${{ needs.terraform.outputs.website_url }}"

          # Verify index.html is accessible
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/index.html")
          if [ "$STATUS" != "200" ]; then
            echo "index.html not accessible (HTTP $STATUS)"
            exit 1
          fi
          echo "index.html verified (HTTP $STATUS)"
